<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0c1222"/>
      <stop offset="50%" style="stop-color:#132040"/>
      <stop offset="100%" style="stop-color:#0c1222"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="60%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="20%" cy="20%" r="30%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#06b6d4" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#06b6d4;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- Glow orbs -->
  <rect width="1200" height="300" fill="url(#glow-teal)"/>
  <rect width="1200" height="300" fill="url(#glow-blue)"/>

  <!-- Particles (bioluminescent plankton) -->
  <circle cx="150" cy="80" r="1.2" fill="#06b6d4" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="220" r="0.8" fill="#06b6d4" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="60" r="1.5" fill="#06b6d4" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="180" r="1.0" fill="#3b82f6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="250" r="1.3" fill="#06b6d4" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="40" r="0.9" fill="#3b82f6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="260" r="1.1" fill="#06b6d4" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="240" r="1.4" fill="#06b6d4" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Wave path at bottom -->
  <path d="M0,270 Q150,255 300,265 Q450,275 600,260 Q750,245 900,258 Q1050,270 1200,255 L1200,300 L0,300 Z" fill="#06b6d4" opacity="0.05"/>

  <!-- Name -->
  <text x="600" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0" text-anchor="middle" filter="url(#text-glow)">Peterson Olay</text>

  <!-- Role -->
  <text x="600" y="160" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="17" font-weight="400" fill="#06b6d4" text-anchor="middle" letter-spacing="4">DEVOPS · CLOUD INFRASTRUCTURE · SRE</text>

  <!-- Tagline -->
  <text x="600" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="1">Automating everything between git push and 99.9% uptime</text>

  <!-- Bottom accent line -->
  <rect x="0" y="269" width="1200" height="1.5" fill="url(#border-grad)"/>

  <!-- Corner bracket accents -->
  <path d="M20,15 L20,32 L37,32" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <path d="M1180,15 L1180,32 L1163,32" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <path d="M20,285 L20,268 L37,268" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <path d="M1180,285 L1180,268 L1163,268" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
</svg>
